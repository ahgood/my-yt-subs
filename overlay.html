<div class="my-yt-subs-overlay" data-overlay-root>
  <div class="my-yt-subs-backdrop" data-overlay-close></div>
  <div class="my-yt-subs-panel" role="dialog" aria-modal="true">
    <header class="my-yt-subs-header">
      <div class="my-yt-subs-brand">
        <div class="my-yt-subs-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M4 7.5C4 6.12 5.12 5 6.5 5h11c1.38 0 2.5 1.12 2.5 2.5v9c0 1.38-1.12 2.5-2.5 2.5h-11C5.12 19 4 17.88 4 16.5v-9Z"
            />
            <path d="M10 9.5 15.5 12 10 14.5Z" />
          </svg>
        </div>
        <div>
          <div class="my-yt-subs-title">My YT Subscriptions</div>
          <div class="my-yt-subs-subtitle">
            Browse your channel list without leaving the page.
          </div>
        </div>
      </div>
      <div class="my-yt-subs-actions">
        <button
          type="button"
          class="my-yt-subs-icon-button"
          data-refresh
          aria-label="Refresh subscriptions"
          title="Refresh subscriptions"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              class="my-yt-subs-refresh-arc"
              d="M18.24 8.4A7.2 7.2 0 1 1 12 4.8"
            />
            <path
              class="my-yt-subs-refresh-head"
              d="M14.4 4.8 11.4 2.5 11.4 7.1Z"
            />
          </svg>
        </button>
        <button
          type="button"
          class="my-yt-subs-close"
          data-overlay-close
          aria-label="Close overlay"
        ></button>
      </div>
    </header>

    <div class="my-yt-subs-search" data-search-wrap>
      <input
        type="search"
        placeholder="Search channels"
        autocomplete="off"
        aria-label="Search channels"
        data-search
      />
    </div>

    <div class="my-yt-subs-body">
      <div class="my-yt-subs-state" data-state>
        <div class="my-yt-subs-spinner"></div>
        <div data-state-text>Loading subscriptions...</div>
      </div>

      <section class="my-yt-subs-section" data-starred-section hidden>
        <h2 class="my-yt-subs-section-title">
          Starred
          <span class="my-yt-subs-section-count" data-starred-count></span>
        </h2>
        <div class="my-yt-subs-list" data-starred-list></div>
      </section>

      <section class="my-yt-subs-section" data-all-section hidden>
        <h2 class="my-yt-subs-section-title">
          All channels
          <span class="my-yt-subs-section-count" data-all-count></span>
        </h2>
        <div class="my-yt-subs-list" data-list></div>
      </section>

      <div class="my-yt-subs-empty" data-empty hidden>
        <div class="my-yt-subs-empty-title">Please sign in to YouTube to load subscriptions.</div>
        <div class="my-yt-subs-empty-body">
          Open YouTube and sign in, then click Refresh.
        </div>
        <div class="my-yt-subs-empty-actions">
          <button type="button" class="my-yt-subs-button primary" data-login>Login to YouTube</button>
        </div>
      </div>
    </div>

    <footer class="my-yt-subs-footer">
      <div
        class="my-yt-subs-footer-status"
        data-footer-status
        role="status"
        aria-live="polite"
      ></div>
      <div class="my-yt-subs-footer-actions">
        <button type="button" class="my-yt-subs-button ghost" data-export>
          Export starred
        </button>
        <button type="button" class="my-yt-subs-button ghost" data-import>
          Import starred
        </button>
        <input
          type="file"
          accept="application/json,.json"
          aria-label="Import starred channels"
          data-import-file
          hidden
        />
      </div>
    </footer>
  </div>
</div>
